# Nginx du projet AnkadeZ (aucun port public : Nginx Proxy Manager le joint par le réseau Docker « web »).
# Résolveur Docker : l'adresse du conteneur de l'application est relue à chaque requête (pas d'erreur 502 après un redémarrage).
resolver 127.0.0.11 valid=10s ipv6=off;

# Le schéma (https) vient de Nginx Proxy Manager ; à défaut, celui de la requête.
map $http_x_forwarded_proto $proto_client {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 12M;          # pièces de data room (10 Mo max côté application)
    server_tokens off;

    # Fichiers sensibles jamais servis
    location ~ /\.(?!well-known) { deny all; }
    location ~* (docker-compose\.ya?ml|Dockerfile|\.env)$ { deny all; }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Pièces de data room : jamais en accès libre. L'application vérifie les droits puis délègue l'envoi (X-Accel-Redirect).
    location /media/ {
        internal;
        alias /app/media/;
    }

    location / {
        set $application http://app:8000;
        proxy_pass $application;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_client;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
