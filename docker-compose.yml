# AnkadeZ · production sur le VPS : nginx (réseau « web » de Nginx Proxy Manager) + Django/Gunicorn + PostgreSQL.
# Aucun port n'est publié : seul le conteneur nginx rejoint le réseau partagé « web ».
name: ankadez

services:
  db:
    image: postgres:16-alpine
    container_name: ankadez_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Africa/Douala
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [interne]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: ankadez-app
    container_name: ankadez_app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static:/app/staticfiles
      - media:/app/media
      - ./donnees:/app/donnees:ro        # CSV à importer (jamais commités)
    networks: [interne]

  nginx:
    image: nginx:1.27-alpine
    container_name: ankadez_nginx
    restart: unless-stopped
    depends_on: [app]
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/app/staticfiles:ro
      - media:/app/media:ro
    networks:
      interne: {}
      web:
        # Nom joint par Nginx Proxy Manager. Une installation existante peut garder son ancien nom : NGINX_ALIAS dans le .env.
        aliases: ["${NGINX_ALIAS:-ankadez_nginx}"]

volumes:
  # Base et pièces : une installation existante garde ses volumes en indiquant leur nom dans le .env (PGDATA_VOLUME, MEDIA_VOLUME).
  pgdata:
    name: ${PGDATA_VOLUME:-ankadez_pgdata}
  static:
  media:
    name: ${MEDIA_VOLUME:-ankadez_media}

networks:
  interne: {}
  web:
    external: true
