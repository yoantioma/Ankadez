# /etc/nginx/sites-available/ankadez  — remplacer ankadez.exemple.cm par votre domaine.
# Certbot ajoutera ensuite le bloc HTTPS (sudo certbot --nginx -d ankadez.exemple.cm).

upstream ankadez_app {
    server unix:/run/ankadez/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name ankadez.exemple.cm;

    client_max_body_size 12M;   # pièces de data room (10 Mo max côté application)

    location /static/ {
        alias /srv/ankadez/app/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Les pièces de data room ne sont pas servies publiquement par Nginx :
    # à ce stade, elles ne sont accessibles qu'aux personnes connectées via l'application.
    location /media/ {
        internal;
        alias /srv/ankadez/app/media/;
    }

    location / {
        proxy_pass http://ankadez_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
